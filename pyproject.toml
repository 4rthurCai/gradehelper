[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradehelper"
version = "3.0.0"
description = "Automated homework grading for SJTU-JI ENGR1510J (Canvas, Gitea, JOJ, Mattermost)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "canvasapi>=3.0",
    "focs_gitea>=1.22.0",
    "GitPython>=3.1.18",
    "mattermostdriver>=7.3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[project.scripts]
gradehelper = "gradehelper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradehelper = ["web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI's Form(...) defaults are idiomatic
