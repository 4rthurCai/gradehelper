# h4
language = "c"
pass_threshold = 300  # JOJ h4 total at/above this passes all JOJ checks
mandatory = ["CMakeLists.txt", "Makefile", "homework.h", "main.c", "ex1.c", "ex2.c", "ex5.c", "ex5-exp.c", "ex5-prod.c", "ex5-quorem.c", "ex5-sum.c"]
optional = ["h4-math.c", "ex3.c", "ex4.c", "ex5-exp.h", "ex5-prod.h", "ex5-quorem.h", "ex5-sum.h", "ex5.h", "ex1.h", "ex2.h", "ex3.h", "ex4.h"]
# canvas_assignment_id = 0  # only needed if several assignments start with this hN

[deadlines]
# Read from the Canvas assignment: group = due date, final = "available until",
# individual = group - 2 days. Set a value here only to override Canvas, e.g.:
# group = "2026-10-02T23:59:00+08:00"

# JOJ exercise maxima are read from the JOJ3 configs in engr151-joj (master branch):
# hN/exK/conf.json (individual) and hN/conf-release.json (release, graded exercises).
# Override only if needed:
# [joj.exercises]  # individual max per exercise number; 0 = not graded
# 2 = 10
# [joj.release]    # release max per exercise
# ex2 = 45
